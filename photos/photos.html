---
layout: default
title: Photos
permalink: /photos/
---

<h1>Photos</h1>

<nav id="photo-menu"></nav>
<div id="photo-status"></div>
<div id="photo-gallery" class="gallery"></div>

<!-- Lightbox -->
<div id="lightbox" class="lb" aria-hidden="true">
  <div class="lb-topbar">
    <button id="lb-download" class="lb-btn" type="button">Télécharger</button>
    <button id="lb-close" class="lb-btn" type="button">Fermer</button>
  </div>

  <button id="lb-prev" class="lb-nav lb-prev" aria-label="Photo précédente" type="button">‹</button>
  <img id="lb-img" class="lb-img" alt="">
  <button id="lb-next" class="lb-nav lb-next" aria-label="Photo suivante" type="button">›</button>
  <div id="lb-caption" class="lb-caption"></div>
</div>


<script>
  const R2_BASE = "https://weathered-math-a354.jeremieschouwey.workers.dev";

  const menuEl = document.getElementById("photo-menu");
  const statusEl = document.getElementById("photo-status");
  const galleryEl = document.getElementById("photo-gallery");

  // Lightbox elements
  const lb = document.getElementById("lightbox");
  const lbImg = document.getElementById("lb-img");
  const lbCaption = document.getElementById("lb-caption");
  const lbClose = document.getElementById("lb-close");
  const lbPrev = document.getElementById("lb-prev");
  const lbNext = document.getElementById("lb-next");
  const lbDownload = document.getElementById("lb-download");

  let currentFiles = [];
  let currentIndex = 0;

  function setStatus(msg) { statusEl.textContent = msg || ""; }

  function setActive(id) {
    for (const a of menuEl.querySelectorAll("a")) {
      a.classList.toggle("active", a.dataset.id === id);
    }
  }

  function openLightbox(index) {
    currentIndex = index;
    const file = currentFiles[currentIndex];
    const filename = file.key.split("/").pop();
    const imgUrl = encodeURI(`${R2_BASE}/${file.key}`);

    lbImg.src = imgUrl;
    lbImg.alt = filename;
    lbCaption.textContent = filename;

    lbDownload.onclick = () => {
      const downloadUrl = encodeURI(`${R2_BASE}/download/${file.key}`);
      window.location.href = downloadUrl;
    };


    lb.classList.add("open");
    lb.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";
  }

  function closeLightbox() {
    lb.classList.remove("open");
    lb.setAttribute("aria-hidden", "true");
    lbImg.src = "";
    document.body.style.overflow = "";
  }

  function prevLightbox() {
    if (!currentFiles.length) return;
    openLightbox((currentIndex - 1 + currentFiles.length) % currentFiles.length);
  }

  function nextLightbox() {
    if (!currentFiles.length) return;
    openLightbox((currentIndex + 1) % currentFiles.length);
  }

  function renderGallery(files) {
    currentFiles = files || [];
    galleryEl.innerHTML = "";
    currentFiles.forEach((f, idx) => {
      const img = document.createElement("img");
      img.src = encodeURI(`${R2_BASE}/${f.key}`);
      img.loading = "lazy";
      img.alt = f.key.split("/").pop();
      img.addEventListener("click", () => openLightbox(idx));
      galleryEl.appendChild(img);
    });
  }

  async function fetchJson(path) {
    const res = await fetch(`${R2_BASE}${path}`);
    if (!res.ok) throw new Error(`HTTP ${res.status} sur ${path}`);
    return res.json();
  }

  async function loadFolders() { return fetchJson("/api/folders"); }
  async function loadFiles(prefix) { return fetchJson(`/api/list?prefix=${encodeURIComponent(prefix)}`); }

  async function showFolder(folder) {
    setActive(folder.id);
    setStatus(`Chargement: ${folder.label}…`);
    const data = await loadFiles(folder.prefix);
    setStatus(`${data.files.length} photo(s)`);
    renderGallery(data.files);
  }

  function updateHash(id) { location.hash = `#${id}`; }

  async function init() {
    try {
      const data = await loadFolders();
      const folders = data.folders || [];
      if (!folders.length) { setStatus("Aucun dossier trouvé dans le stockage."); return; }

      menuEl.innerHTML = "";
      for (const f of folders) {
        const a = document.createElement("a");
        a.href = `#${f.id}`;
        a.dataset.id = f.id;
        a.textContent = f.label;
        a.addEventListener("click", (e) => {
          e.preventDefault();
          updateHash(f.id);
          showFolder(f);
        });
        menuEl.appendChild(a);
      }

      const currentId = (location.hash || "").replace("#", "");
      const initial = folders.find(x => x.id === currentId) || folders[0];
      updateHash(initial.id);
      await showFolder(initial);

    } catch (err) {
      console.error(err);
      setStatus("Erreur: impossible de charger les albums/photos.");
    }
  }

  // Lightbox interactions
  lbClose.addEventListener("click", closeLightbox);
  lbPrev.addEventListener("click", prevLightbox);
  lbNext.addEventListener("click", nextLightbox);

  lb.addEventListener("click", (e) => { if (e.target === lb) closeLightbox(); });

  document.addEventListener("keydown", (e) => {
    if (!lb.classList.contains("open")) return;
    if (e.key === "Escape") closeLightbox();
    if (e.key === "ArrowLeft") prevLightbox();
    if (e.key === "ArrowRight") nextLightbox();
  });

  window.addEventListener("hashchange", init);
  init();
</script>
