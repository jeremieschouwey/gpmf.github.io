<div
  id="flyer-modal"
  class="flyer-modal"
  role="dialog"
  aria-modal="true"
  aria-labelledby="flyer-modal-title"
>
  <div class="flyer-modal-inner">
    <div class="flyer-modal-header">
      <h2 id="flyer-modal-title" class="flyer-modal-title">Conférence — 25 juin 2026</h2>
      <button
        class="flyer-modal-close"
        id="flyer-modal-close"
        aria-label="Fermer"
      >
        &times;
      </button>
    </div>
    <div class="flyer-modal-body flyer-modal-body--image">
      <img
        src="{{ '/assets/images/flyer_conference.jpg' | relative_url }}"
        alt="Flyer Conférence GPMF — 25 juin 2026"
        class="flyer-conference-img"
      />
    </div>
  </div>
</div>

<script>
  (function () {
    var EXPIRY = new Date("2026-06-26");
    var SESSION_KEY = "gpmf-conference-2026";

    if (new Date() >= EXPIRY) return;
    if (sessionStorage.getItem(SESSION_KEY)) return;

    var modal = document.getElementById("flyer-modal");
    var closeBtn = document.getElementById("flyer-modal-close");

    function closeModal() {
      modal.classList.remove("open");
      document.body.classList.remove("flyer-modal-open");
      sessionStorage.setItem(SESSION_KEY, "1");
    }

    document.addEventListener("DOMContentLoaded", function () {
      modal.classList.add("open");
      document.body.classList.add("flyer-modal-open");
    });

    closeBtn.addEventListener("click", closeModal);

    modal.addEventListener("click", function (e) {
      if (e.target === modal) closeModal();
    });

    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && modal.classList.contains("open")) closeModal();
    });
  })();
</script>
